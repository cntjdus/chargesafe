# Render 배포 청사진 (Blueprint)
# Render 대시보드에서 이 저장소를 연결하면 이 파일을 읽어 서비스를 자동 구성합니다.
# 비밀값(sync: false)은 저장소에 저장되지 않고 배포 시 직접 입력합니다.
services:
  - type: web
    name: chargesafe
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
